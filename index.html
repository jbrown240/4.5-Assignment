<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3.2 Assignment - Strings and Conditionals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 40px;
        }
        .container {
            background-color: white;
            padding: 25px;
            max-width: 450px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #004c99;
        }
        #result-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #e8f4fd;
            border-left: 4px solid #0066cc;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Auto Financing & Discount Calculator</h2>
        
        <div class="form-group">
            <label for="custName">Customer Name:</label>
            <input type="text" id="custName" placeholder="e.g. Jamal Brown">
        </div>

        <div class="form-group">
            <label for="creditScore">Credit Score Tier:</label>
            <select id="creditScore">
                <option value="excellent">Excellent (750+)</option>
                <option value="good">Good (670 - 749)</option>
                <option value="fair">Fair (580 - 669)</option>
                <option value="poor">Poor (Below 580)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="vehiclePrice">Vehicle Price ($):</label>
            <input type="number" id="vehiclePrice" placeholder="e.g. 32000">
        </div>

        <button onclick="calculateFinancing()">Check Rates & Pricing</button>

        <div id="result-box">
            <p id="summary-output"></p>
            <p id="price-output"></p>
            <p id="perk-output"></p>
        </div>
    </div>

    <!-- Link to external JS file -->
    <script src="app.js"></script>
</body>
</html>
